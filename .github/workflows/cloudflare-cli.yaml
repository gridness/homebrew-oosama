name: Update Cloudflare CLI formula

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

# ASVS 13.2.2: Grant the permission needed to push the formula update.
permissions:
  contents: write

concurrency:
  group: update-cloudflare-cli-formula
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Update formula from npm
        run: |
          python3 scripts/update-cloudflare-cli-formula.py
          ruby -c Formula/cloudflare-cli.rb

      - name: Commit and push update to main
        shell: bash
        run: |
          set -euo pipefail
          git add Formula/cloudflare-cli.rb
          if git diff --cached --quiet; then
            exit 0
          fi

          version="$(sed -n 's/^  version "\([0-9A-Za-z.-]*\)"$/\1/p' Formula/cloudflare-cli.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cloudflare-cli ${version}"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "::error::Could not push the Cloudflare CLI formula update to main."
          exit 1
