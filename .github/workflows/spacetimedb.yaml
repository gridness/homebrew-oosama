name: Update SpacetimeDB formula

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-spacetime-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Update formula from latest SpacetimeDB release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release="$(gh api repos/clockworklabs/SpacetimeDB/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"$release")"
          version="${tag#v}"

          arm_name="spacetime-aarch64-apple-darwin.tar.gz"
          intel_name="spacetime-x86_64-apple-darwin.tar.gz"

          arm_url="$(
            jq -r \
              --arg name "$arm_name" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"$release"
          )"

          intel_url="$(
            jq -r \
              --arg name "$intel_name" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"$release"
          )"

          if [[ -z "$tag" || "$tag" == "null" ||
                -z "$arm_url" || "$arm_url" == "null" ||
                -z "$intel_url" || "$intel_url" == "null" ]]; then
            echo "::error::Latest release is missing expected macOS assets."
            exit 1
          fi

          echo "Latest release: $tag"

          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "$arm_url" \
            -o /tmp/spacetime-arm64.tar.gz

          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "$intel_url" \
            -o /tmp/spacetime-x86_64.tar.gz

          # Make sure upstream hasn't unexpectedly changed the archive layout.
          for archive in \
            /tmp/spacetime-arm64.tar.gz \
            /tmp/spacetime-x86_64.tar.gz
          do
            listing="$(tar -tzf "$archive" | sed 's#^\./##')"

            grep -qx 'spacetimedb-cli' <<<"$listing"
            grep -qx 'spacetimedb-standalone' <<<"$listing"
          done

          arm_sha="$(
            sha256sum /tmp/spacetime-arm64.tar.gz |
            awk '{print $1}'
          )"

          intel_sha="$(
            sha256sum /tmp/spacetime-x86_64.tar.gz |
            awk '{print $1}'
          )"

          mkdir -p Formula

          cat > Formula/spacetime.rb <<EOF
          class Spacetime < Formula
            desc "Command-line interface for SpacetimeDB"
            homepage "https://spacetimedb.com"
            version "${version}"

            depends_on :macos

            if Hardware::CPU.arm?
              url "${arm_url}"
              sha256 "${arm_sha}"
            else
              url "${intel_url}"
              sha256 "${intel_sha}"
            end

            def caveats
              <<~EOS
                This formula uses Homebrew for SpacetimeDB version management.
                Upgrade with:

                  brew upgrade spacetime

                SpacetimeDB stores user configuration and local database data
                outside the Homebrew prefix. These are intentionally preserved
                when the formula is uninstalled.

                Default locations:

                  ~/.config/spacetime
                  ~/.local/share/spacetime/data

                If you previously used the official SpacetimeDB installer, it may
                also have installed version-managed binaries under:

                  ~/.local/share/spacetime/bin
                  ~/.local/bin/spacetime
              EOS
            end

            def install
              bin.install "spacetimedb-cli" => "spacetime"
              bin.install "spacetimedb-standalone"
            end

            test do
              system bin/"spacetime", "--version"
            end
          end
          EOF

          ruby -c Formula/spacetime.rb

          if git diff --quiet -- Formula/spacetime.rb; then
            echo "Already at SpacetimeDB ${version}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Formula needs update to ${version}."
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit update
        if: steps.update.outputs.changed == 'true'
        id: commit
        env:
          VERSION: ${{ steps.update.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/spacetime-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"

          git add Formula/spacetime.rb
          git commit -m "spacetime ${VERSION}"

          git push --force origin "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open and auto-merge pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          VERSION: ${{ steps.update.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          pr_url="$(
            gh pr list \
              --head "$BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "$pr_url" ]]; then
            pr_url="$(
              gh pr create \
                --base "$DEFAULT_BRANCH" \
                --head "$BRANCH" \
                --title "spacetime ${VERSION}" \
                --body "Automated Homebrew formula update for SpacetimeDB ${VERSION}."
            )"
          else
            echo "PR already exists: $pr_url"
          fi

          gh pr merge "$pr_url" \
            --squash \
            --delete-branch \
            --match-head-commit "$(git rev-parse HEAD)"
